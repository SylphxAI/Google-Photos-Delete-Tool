name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fails a change that adds a direct chat-API host (Telegram, Slack, Discord)
  # outside the action's allow-list: chat messages go through Notify. The
  # action compares the lines the change adds, so the job needs the full
  # history of the pull request or merge group. Pinned by commit: a caller
  # moves deliberately when the allow-list widens.
  chat-senders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: SylphxAI/.github/.github/actions/chat-senders@5cfd55a41435cca8e4b7caf6506faf04ca08d200
        with:
          mode: fail

  check:
    name: Lint, Type Check, Test, Build & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Find duplicates end to end (test page, no Google account)
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node scripts/dupes-demo.mjs --check --no-screenshot

      - name: Responsive localized storefront
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node scripts/site-responsive.mjs

      - name: Verify storefront listing
        run: bun run listing:check

      - name: Verify artifacts
        run: bun run verify

      - name: Zip
        run: bun run zip

      - name: Size budget (content.js and store zip, 5% over budgets/size.json fails)
        run: bun run size:check

  # The org-wide required check name. Skipped lanes pass; a failed or
  # cancelled lane fails.
  ci-ok:
    if: always()
    needs: [chat-senders, check]
    # The reserved gate pool (Kueue queue scale-set-gate, never lends): an
    # `if: always()` verdict still runs after its run is cancelled, and that run
    # keeps its concurrency group until it does, so on a busy build pool a
    # superseded run held the next one (SylphxAI/agents#4222, 2026-10-02).
    runs-on: sylphx-linux-control
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/needs-pass@46ec433892bca8693193049b5ee7441bb916a7ad # main
        with:
          needs: ${{ toJSON(needs) }}
