name: Publish to Chrome Web Store (manual)

# Compatibility entrypoint: use the same release resolver and publisher as
# publish-stores.yml and store-retry.yml, including review-queue handling.
# A blank tag resolves the latest GitHub release, never the dispatch SHA.
#
#   gh workflow run "Publish to Chrome Web Store (manual)" -f tag=v3.0.1
#
# Staged submission (staged_ref set): builds the store zip from that commit,
# refuses unless its content digest (scripts/zip-content-digest.sh) equals
# content_digest, uploads it and submits it for review with publishType
# STAGED_PUBLISH. After review the version waits as STAGED; it goes live only
# when someone publishes it (dashboard, or a later v2 publish call). This path
# never publishes, never tags and never touches store-state, so it can run
# before the release it belongs to is tagged.
#
#   gh workflow run "Publish to Chrome Web Store (manual)" \
#     -f staged_ref=<40-hex commit> -f content_digest=<64-hex> -f publisher_id=<CWS publisher id>
#
# Existing approved STAGED revision (publish_staged_version set): reads
# fetchStatus, publishes that exact staged version once and reads it back. It
# never uploads a zip, creates a tag or touches store-state. Repeating it after
# the version is live is a read-only no-op.
#
#   gh workflow run "Publish to Chrome Web Store (manual)" \
#     -f publish_staged_version=3.6.1

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build and publish (default: latest release tag)'
        required: false
        default: ''
      cancel_pending:
        description: 'Cancel a pending CWS review before uploading (service-account path only; default off)'
        required: false
        type: boolean
        default: false
      staged_ref:
        description: 'Staged submission: full commit SHA to build and submit with STAGED_PUBLISH (blank = normal tag publish)'
        required: false
        default: ''
      content_digest:
        description: 'Staged submission: expected content digest of the Chrome zip (scripts/zip-content-digest.sh)'
        required: false
        default: ''
      publisher_id:
        description: 'Staged submission: CWS publisher id (dashboard Account page; not a secret). Blank = the CWS_PUBLISHER_ID repo variable or secret'
        required: false
        default: ''
      publish_staged_version:
        description: 'Publish this existing approved STAGED version without uploading (exclusive with tag, cancel_pending and staged_ref)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: store-publish
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.publish_staged_version == ''
    uses: ./.github/workflows/store-publish.yml
    with:
      stores: cws
      tag: ${{ inputs.tag }}
      cancel_pending: ${{ inputs.cancel_pending }}
      staged_ref: ${{ inputs.staged_ref }}
      content_digest: ${{ inputs.content_digest }}
      publisher_id: ${{ inputs.publisher_id }}
    secrets: inherit

  publish-staged:
    name: Publish existing STAGED revision
    if: inputs.publish_staged_version != ''
    runs-on: sylphx-linux-standard
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Validate exclusive inputs
        env:
          TAG: ${{ inputs.tag }}
          CANCEL: ${{ inputs.cancel_pending }}
          STAGED_REF: ${{ inputs.staged_ref }}
          CONTENT_DIGEST: ${{ inputs.content_digest }}
        run: |
          set -euo pipefail
          [ -z "$TAG" ] || { echo "::error::tag and publish_staged_version are exclusive"; exit 1; }
          [ "$CANCEL" = false ] || { echo "::error::cancel_pending does not apply to an approved STAGED revision"; exit 1; }
          [ -z "$STAGED_REF" ] || { echo "::error::staged_ref submits a new package; publish_staged_version publishes the existing one"; exit 1; }
          [ -z "$CONTENT_DIGEST" ] || { echo "::error::content_digest belongs to staged_ref; the store readback pins the staged version"; exit 1; }

      - name: Publish the existing revision and read it back
        env:
          VERSION: ${{ inputs.publish_staged_version }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ inputs.publisher_id || secrets.CWS_PUBLISHER_ID || vars.CWS_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: node scripts/cws-v2.mjs publish-staged --version "$VERSION"
