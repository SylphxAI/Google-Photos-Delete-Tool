name: Money Access refusals
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    name: Verify Access (${{ matrix.declaration }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - declaration: google-photos-delete-tool-money-catalogue-preview
            environment: orgs/org_fs01afbdccgn8xdk1ghj5y47w0vtph/projects/prj_fs01etb6sjwf33tcvmhf93jwppx8a0/envs/env_fs01mrzxcsmcvp9w6h3j040b6p02zt
            other_environment: orgs/org_fs01afbdccgn8xdk1ghj5y47w0vtph/projects/prj_fs01etb6sjwf33tcvmhf93jwppx8a0/envs/env_fs01kkyfapshabd01pdps7kf0f72cr
            scopes: billing:read,billing:write,billing:licence_keys.approve
          - declaration: google-photos-delete-tool-money-catalogue-production
            environment: orgs/org_fs01afbdccgn8xdk1ghj5y47w0vtph/projects/prj_fs01etb6sjwf33tcvmhf93jwppx8a0/envs/env_fs01kkyfapshabd01pdps7kf0f72cr
            other_environment: orgs/org_fs01afbdccgn8xdk1ghj5y47w0vtph/projects/prj_fs01etb6sjwf33tcvmhf93jwppx8a0/envs/env_fs01mrzxcsmcvp9w6h3j040b6p02zt
            scopes: billing:read,billing:write,billing:licence_keys.approve
    env:
      EXPECT_REFUSAL: 'true'
      ACCESS_NAME: ${{ matrix.declaration }}
      EXPECTED_ENVIRONMENT: ${{ matrix.environment }}
      OTHER_ENVIRONMENT: ${{ matrix.other_environment }}
      EXPECTED_SCOPES: ${{ matrix.scopes }}
      EXPECTED_REF: refs/heads/master
      OTHER_REPOSITORY_DECLARATION: anymd-money-catalogue-preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/money-access-verify.py
